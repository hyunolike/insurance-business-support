# ─────────────────────────────────────────────────────────────────────────────
# business-support 설정
#
# 비밀값에는 기본값을 주지 않는다. 미설정 시 기동이 실패하는 것이 정상 동작이다.
#
# 포트가 claims-platform 과 다르다 (앱 8081, DB 5433, Redis 6380).
# 두 서비스를 동시에 띄워 레포 간 E2E를 돌려야 하기 때문이다. Kafka는 공유한다.
#
# 로컬 개발값은 .env.example 참고.
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: business-support

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/policy}
    username: ${DB_USERNAME:policy}
    password: ${DB_PASSWORD}              # 기본값 없음 → 미설정 시 기동 실패
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate                  # 스키마는 Flyway가 만든다
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: false
    # ★ 시드(db/seed)는 기본 경로에 없다. 마이그레이션에 섞으면 운영 DB 에
    #   가짜 계약이 들어간다. local 프로파일에서만 아래에서 추가한다.
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # acks=all 이 아니면 리더만 받고 응답한다. 리더 장애 시 이벤트가 사라지는데
      # 릴레이는 이미 PUBLISHED 로 표시한 뒤다 — Outbox 를 둔 의미가 없어진다.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1   # 재시도 시 순서 역전 방지
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:business-support}
      auto-offset-reset: earliest
      enable-auto-commit: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

policy:
  encryption:
    key: ${POLICY_ENCRYPTION_KEY}         # 기본값 없음
    key-version: ${POLICY_ENCRYPTION_KEY_VERSION:v1}

  underwriting:
    ruleset-version: ${UW_RULESET_VERSION:2026.01}
    # 부담보를 이 개수 넘게 붙이면 자동 인수하지 않고 회부한다 (U-CND-080).
    # "인수는 했지만 쓸모없는 계약"은 불완전판매 리스크다.
    max-auto-exclusions: ${UW_MAX_AUTO_EXCLUSIONS:2}

  snapshot:
    # 확정된 과거 스냅샷은 변하지 않는다 — Bitemporal 모델의 부수적 이득이다.
    # policy.corrected 발생이 유일한 무효화 트리거다.
    cache-past-ttl: ${SNAPSHOT_CACHE_PAST_TTL:P365D}
    cache-current-ttl: ${SNAPSHOT_CACHE_CURRENT_TTL:PT5M}

  premium:
    grace-period: ${PREMIUM_GRACE_PERIOD:P2M}
    demand-notice-period: ${DEMAND_NOTICE_PERIOD:P14D}

  reinstatement:
    window: ${REINSTATEMENT_WINDOW:P3Y}

  outbox:
    relay:
      # 릴레이는 운영에서만 돈다. 통합 테스트는 브로커 없이 relayOnce() 를 직접 부른다.
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      publisher: ${OUTBOX_RELAY_PUBLISHER:kafka}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
      max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:5}
      # 폴링 간격(ms). 계약 이벤트는 초 단위 지연이 문제가 되지 않는다.
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:1000}
      # 기동 직후에는 마이그레이션·커넥션 풀 준비가 끝나길 기다린다.
      initial-delay: ${OUTBOX_RELAY_INITIAL_DELAY:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: business-support

logging:
  level:
    root: INFO
    com.insurance.policy: ${LOG_LEVEL:INFO}


# ─────────────────────────────────────────────────────────────────────────────
# local — 로컬 개발 및 claims 연동 확인용
#
# 시드 4건이 들어간다. claims 의 골든 케이스가 이 계약번호를 참조한다.
#   P2026-9000001  정상 4세대 실손
#   P2026-9000002  척추 부담보 (M40-M54, 5년)   → D-POL-004 부지급 경로
#   P2026-9000003  유예 후 실효                 → 사고일 시점 상태 판정
#   P2026-9000004  정정 이력 있음               → ★ 같은 asOf, 다른 knownAt
#
#   ./gradlew :policy-bootstrap:bootRun --args='--spring.profiles.active=local'
# ─────────────────────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
