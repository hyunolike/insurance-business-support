# 통합 테스트 공통 기본값.
#
# ★ 규칙: 자동설정을 제외했으면, 그것을 쓰는 기능도 함께 꺼야 한다.
#
#   IntegrationTestBase 는 Kafka·Redis 자동설정을 제외한다. 그런데 그것을 쓰는
#   기능(릴레이·스냅샷 캐시)이 켜져 있으면, 빈을 만들다가 KafkaTemplate /
#   StringRedisTemplate 이 없어서 컨텍스트 로딩 자체가 실패한다. 그러면
#   그 컨텍스트를 쓰는 테스트가 전부 "ApplicationContext failure threshold exceeded"
#   로 무더기 실패한다 — 실제로 두 번 겪었다.
#
# 우선순위 때문에 여기에 둔다. @DynamicPropertySource 는 @TestPropertySource 보다
# 우선순위가 높아서, IntegrationTestBase 에서 registry.add 로 끄면 하위 테스트가
# @TestPropertySource 로 다시 켤 수 없다. application.properties 는 둘 다보다
# 낮으므로 "기본은 끔, 필요한 테스트만 켬"이 성립한다.

# Outbox 릴레이 — 스케줄러가 배경에서 돌면 outbox_event 단언이 타이밍에 흔들린다.
# OutboxRelayIntegrationTest 만 켜고, 거기서도 relayOnce() 를 직접 부른다.
policy.outbox.relay.enabled=false

# 스냅샷 캐시 — Redis 를 띄우지 않는다.
# 캐시 판단 자체는 SnapshotCacheTest 가 Redis 없이 검증한다.
policy.snapshot.cache.enabled=false
