# 통합 테스트 공통 기본값.
#
# 우선순위 때문에 여기에 둔다. @DynamicPropertySource 는 @TestPropertySource 보다
# 우선순위가 높아서, IntegrationTestBase 에서 registry.add 로 끄면 하위 테스트가
# @TestPropertySource 로 다시 켤 수 없다. application.properties 는 둘 다보다
# 낮으므로 "기본은 끔, 필요한 테스트만 켬"이 성립한다.

# 릴레이는 기본적으로 끈다. 스케줄러가 배경에서 돌면 다른 테스트의
# outbox_event 단언이 타이밍에 따라 흔들린다.
policy.outbox.relay.enabled=false
