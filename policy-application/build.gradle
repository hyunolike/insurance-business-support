// policy-application : 유스케이스, 트랜잭션 경계, 포트 정의
// ApplicationEventPublisher 를 쓰지 않는다 — 애그리거트가 record(), Outbox로 저장.
dependencies {
    api project(':policy-domain')
    implementation project(':policy-underwriting')

    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
}

jacocoTestCoverageVerification {
    violationRules { rule { element = 'BUNDLE'; limit { counter = 'LINE'; minimum = 0.00 } } }
}
