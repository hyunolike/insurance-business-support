// ─────────────────────────────────────────────────────────────
// policy-domain : 순수 자바 도메인
//
// 의존성이 없다. Spring도, JPA도, Jackson도 클래스패스에 존재하지 않는다.
//
// 이 모듈의 핵심은 Bitemporal 시점 조회다.
// Policy.snapshotAsOf(asOf, knownAt)는 순수 함수라 DB 없이 테스트할 수 있다.
// 시점 재현성이 이 시스템의 절대 요구사항이므로, 그 로직이
// 프레임워크와 섞이지 않는 것이 중요하다.
// ─────────────────────────────────────────────────────────────

// 테스트 픽스처를 다른 모듈과 공유한다.
// bootstrap의 통합 테스트가 도메인 단위 테스트와 '같은 계약'을 써야
// 레이어를 넘나드는 검증이 일관된다.
apply plugin: 'java-test-fixtures'

dependencies {
    compileOnly libs.lombok
    annotationProcessor libs.lombok
}

// 픽스처는 커버리지 측정 대상이 아니다 (테스트 지원 코드)
jacocoTestReport {
    classDirectories.setFrom(files(sourceSets.main.output))
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'BRANCH'; minimum = 0.85 }
            limit { counter = 'LINE'; minimum = 0.90 }
        }
    }
}
